<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonics Fun - ฝึกสะกดคำภาษาอังกฤษสุดสนุก!</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Mali:wght@500;700&display=swap" rel="stylesheet">
    <!-- ดึงไลบรารี Tesseract.js สำหรับทำ OCR อ่านข้อความจากรูปภาพ -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Mali', cursive, sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #A8EDEA 0%, #FED6E3 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4A4A4A;
        }

        .container {
            background: #FFFFFF;
            width: 100%;
            max-width: 940px;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
            border: 6px solid #FFD166;
            text-align: center;
            position: relative;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-family: 'Fredoka One', cursive;
            color: #FF6B6B;
            font-size: 2.2rem;
            text-shadow: 2px 2px 0px #FFD166;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            color: #6C757D;
            font-size: 1.05rem;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Upload Button */
        .upload-btn {
            background: #4ECDC4;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #36B3A8;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .upload-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        #fileInput,
        #cameraInput {
            display: none;
        }

        /* Settings Card */
        .controls-card {
            background: #F4F9FF;
            border-radius: 20px;
            padding: 20px;
            margin-top: 25px;
            margin-bottom: 25px;
            border: 2px solid #E1EEFF;
        }

        .control-group {
            margin-bottom: 18px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .label-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #2D3142;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-icon {
            font-size: 1.8rem;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 14px;
            border-radius: 10px;
            background: #E0E0E0;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #FF6B6B;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            border: 3px solid #FFF;
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        /* Display Word Area */
        .word-display-area {
            background: #FFFFFF;
            border: 3px solid #4ECDC4;
            border-radius: 20px;
            padding: 25px 15px;
            margin-bottom: 25px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
        }

        .letters-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 15px;
        }

        .letter-tile {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            width: 55px;
            height: 65px;
            background: #FFF;
            border: 3px solid #FFD166;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2D3142;
            box-shadow: 0 5px 0 #FFD166;
            transition: all 0.2s ease;
        }

        .letter-tile.active {
            background: #FF6B6B;
            color: #FFF;
            border-color: #FF4747;
            box-shadow: 0 5px 0 #D63030;
            transform: translateY(-6px) scale(1.1);
        }

        .word-full {
            font-family: 'Fredoka One', cursive;
            font-size: 2.2rem;
            color: #4ECDC4;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .word-full.active-full {
            color: #FF6B6B;
            transform: scale(1.15);
        }

        /* Play Controls */
        .action-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.15s ease;
        }

        .btn-play {
            background: #FFD166;
            color: #2D3142;
            box-shadow: 0 6px 0 #E0A926;
        }

        .btn-play:hover {
            background: #FFE082;
        }

        .btn-play:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        .btn-stop {
            background: #FF8E8E;
            color: white;
            box-shadow: 0 6px 0 #D65252;
        }

        .btn-stop:hover {
            background: #FFA4A4;
        }

        .btn-stop:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        .voice-select {
            border: 2px solid #E1EEFF;
            border-radius: 50px;
            padding: 10px 16px;
            font-size: 0.95rem;
            font-family: 'Mali', cursive, sans-serif;
            background: #F4F9FF;
            color: #2D3142;
            cursor: pointer;
            max-width: 240px;
        }

        .voice-select-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .voice-select-label {
            font-weight: 700;
            color: #2D3142;
            font-size: 1rem;
        }

        .tts-url-input {
            width: 100%;
            margin-top: 10px;
            padding: 9px 14px;
            border: 2px solid #E1EEFF;
            border-radius: 12px;
            font-size: 0.9rem;
            font-family: 'Mali', cursive, sans-serif;
            background: #FFFFFF;
            color: #2D3142;
        }

        /* Status Badge */
        .status-badge {
            display: inline-block;
            padding: 8px 18px;
            background: #E8F5E9;
            color: #2E7D32;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Main Layout: Left word list + Right content */
        .main-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .word-list-panel {
            flex: 0 0 200px;
            background: #F4F9FF;
            border: 2px solid #E1EEFF;
            border-radius: 20px;
            padding: 15px;
            text-align: left;
            max-height: 460px;
            overflow-y: auto;
        }

        .word-list-panel h3 {
            font-size: 1.05rem;
            color: #2D3142;
            margin-bottom: 12px;
            text-align: center;
        }

        .word-list-item {
            background: #FFFFFF;
            border: 2px solid #FFD166;
            border-radius: 12px;
            padding: 8px 10px;
            margin-bottom: 8px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.05rem;
            color: #2D3142;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .word-list-item:hover {
            background: #FFF3CD;
            transform: scale(1.03);
        }

        .word-list-item.active {
            background: #FF6B6B;
            color: #FFFFFF;
            border-color: #FF4747;
            box-shadow: 0 4px 0 #D63030;
            transform: scale(1.05);
        }

        .content-panel {
            flex: 1 1 auto;
            min-width: 0;
        }

        @media (max-width: 640px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 18px;
                border-width: 4px;
            }
            .header h1 {
                font-size: 1.7rem;
            }
            .main-layout {
                flex-direction: column;
            }
            .word-list-panel {
                flex: none;
                width: 100%;
                max-height: none;
                display: flex;
                align-items: center;
                gap: 8px;
                overflow-x: auto;
                padding: 12px;
            }
            .word-list-panel h3 {
                display: none;
            }
            .word-list-item {
                flex: 0 0 auto;
                margin-bottom: 0;
                font-size: 1rem;
            }
            .action-btns {
                flex-wrap: wrap;
            }
            .action-btns .btn,
            .action-btns .upload-btn {
                flex: 1 1 auto;
                justify-content: center;
            }
            .upload-btn {
                margin-top: 0;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><span>🎨</span> Phonics Fun! <span>🌟</span></h1>
        <p>ฝึกสะกดคำภาษาอังกฤษกับพี่เต่าและพี่กระต่าย 🐢🐇</p>
    </div>

    <!-- Main Layout: Left word list + Right content -->
    <div class="main-layout">
        <!-- Left Column: OCR word list -->
        <div class="word-list-panel">
            <h3>📚 คำศัพท์</h3>
            <div id="wordList"></div>
        </div>

        <!-- Right Column: Content -->
        <div class="content-panel">
            <!-- Voice selector -->
            <div class="voice-select-row">
                <span class="voice-select-label">🔊 เสียง:</span>
                <select id="voiceSelect" class="voice-select" onchange="onVoiceChange()">
                    <option value="">กำลังโหลดเสียง...</option>
                </select>
            </div>

            <!-- Word Playback Display (moved to top) -->
            <div class="status-badge" id="statusBadge">พร้อมสนุกกันแล้ว! เลือกรูปหรือกดเริ่มฟังได้เลย</div>

            <div class="word-display-area">
                <div class="letters-container" id="lettersContainer"></div>
                <div class="word-full" id="fullWordText"></div>
            </div>

            <!-- Playback buttons (with camera) -->
            <div class="action-btns">
                <button class="upload-btn" type="button" onclick="document.getElementById('cameraInput').click()">
                    <span>📷</span> ถ่ายรูป
                </button>
                <button class="btn btn-play" onclick="startSpellingProcess()">
                    <span>▶️</span> เริ่มฟังเสียงสะกด
                </button>
                <button class="btn btn-stop" onclick="stopSpelling()">
                    <span>⏹️</span> หยุด
                </button>
            </div>

            <!-- Controls -->
            <div class="controls-card">
                <!-- Speed Control -->
            <div class="control-group">
                <div class="label-title">
                    <span>ความเร็วการอ่าน (Speed):</span>
                    <span id="speedVal" style="color: #FF6B6B;">3x</span>
                </div>
                <div class="slider-container">
                    <span class="slider-icon">🐢</span>
                    <input type="range" id="speedSlider" min="0.5" max="5" step="0.1" value="3" oninput="updateSpeedLabel(this.value)">
                    <span class="slider-icon">🐇</span>
                </div>
            </div>

            <!-- Spelling Speed Control -->
            <div class="control-group">
                <div class="label-title">
                    <span>ความเร็วการสะกด:</span>
                    <span id="letterDelayVal" style="color: #4ECDC4;">-1200 ms</span>
                </div>
                <div class="slider-container">
                    <span class="slider-icon">⏳</span>
                    <input type="range" id="letterDelaySlider" min="-2000" max="2000" step="100" value="-1200" style="direction: rtl;" oninput="document.getElementById('letterDelayVal').innerText = this.value + ' ms'">
                    <span class="slider-icon">⚡</span>
                </div>
            </div>

                <!-- Word Delay Control -->
                <div class="control-group">
                    <div class="label-title">
                        <span>เว้นระยะห่างระหว่างแต่ละคำ:</span>
                        <span id="wordDelayVal" style="color: #FFD166;">1.0 วินาที</span>
                    </div>
                    <div class="slider-container">
                        <span class="slider-icon">⏱️</span>
                        <input type="range" id="wordDelaySlider" min="0.1" max="3" step="0.1" value="1" oninput="document.getElementById('wordDelayVal').innerText = this.value + ' วินาที'">
                        <span class="slider-icon">💤</span>
                    </div>
                </div>
                <!-- Google Cloud TTS Control -->
                <div class="control-group">
                    <div class="label-title">
                        <span>เสียง Google Cloud TTS:</span>
                    </div>
                    <label style="display:flex; align-items:center; gap:8px; justify-content:center; font-weight:bold; color:#2D3142; cursor:pointer;">
                        <input type="checkbox" id="useGoogleTTS" onchange="onToggleGoogleTTS()"> ใช้งาน (โควต้าฟรี)
                    </label>
                    <input type="text" id="ttsBackendUrl" class="tts-url-input" placeholder="Backend URL (เช่น /api/tts)">
                </div>
            </div>

            <input type="file" id="fileInput" accept="image/*" onchange="handleImageUpload(event)">
            <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleImageUpload(event)">
        </div>
    </div>
</div>

<script>
    let currentWords = ["RABBIT", "CAT", "PENCIL"];
    let currentWordDisplay = ["RABBIT (n.)", "CAT (n.)", "PENCIL (n.)"];
    let currentWordIndex = 0;
    let isPlaying = false;
    let usFemaleVoice = null;
    let selectedVoice = null;
    let currentPlaybackToken = 0;
    let useGoogleTTS = false;
    let currentAudio = null;
    let selectedGoogleVoice = '';
    let googleVoices = [];
    const speechSupported = typeof window !== 'undefined' && 'speechSynthesis' in window;

    // กรองหาเสียงผู้หญิงสำเนียงอเมริกัน (en-US)
    function loadVoices() {
        if (!speechSupported) {
            usFemaleVoice = null;
            return;
        }

        const voices = window.speechSynthesis.getVoices();
        usFemaleVoice = voices.find(v => v.lang === 'en-US' && (
            v.name.includes('Google US English') ||
            v.name.includes('Samantha') ||
            v.name.includes('Victoria') ||
            v.name.includes('Karen') ||
            v.name.includes('Zira') ||
            v.name.includes('Female')
        )) || voices.find(v => v.lang === 'en-US') || null;

        populateVoiceSelect();
    }

    // สร้างรายการเสียงให้เลือกใน dropdown
    function populateVoiceSelect() {
        if (!speechSupported) return;
        const select = document.getElementById('voiceSelect');
        if (!select) return;
        const voices = window.speechSynthesis.getVoices();
        select.innerHTML = '';
        voices.forEach((v, i) => {
            const opt = document.createElement('option');
            opt.value = String(i);
            opt.textContent = `${v.name} (${v.lang})`;
            select.appendChild(opt);
        });

        const cur = selectedVoice || usFemaleVoice;
        if (cur) {
            const idx = voices.indexOf(cur);
            if (idx >= 0) select.value = String(idx);
        }
    }

    // เมื่อผู้ใช้เลือกเสียงจาก dropdown
    function onVoiceChange() {
        const i = parseInt(document.getElementById('voiceSelect').value, 10);
        if (useGoogleTTS) {
            const v = googleVoices[i];
            selectedGoogleVoice = v ? v.name : '';
        } else {
            if (!speechSupported) return;
            const voices = window.speechSynthesis.getVoices();
            selectedVoice = voices[i] || null;
        }
    }

    // ----- Google Cloud TTS -----
    function ttsBackend() {
        const v = document.getElementById('ttsBackendUrl').value.trim();
        return v || '/api/tts';
    }

    function onToggleGoogleTTS() {
        useGoogleTTS = document.getElementById('useGoogleTTS').checked;
        if (useGoogleTTS) {
            loadGoogleVoices();
        } else {
            selectedGoogleVoice = '';
            populateVoiceSelect();
        }
    }

    async function loadGoogleVoices() {
        const base = ttsBackend().replace(/\/$/, '');
        try {
            const res = await fetch(base + '/voices');
            if (!res.ok) throw new Error('voice list failed');
            googleVoices = await res.json();
            populateGoogleVoiceSelect();
        } catch (e) {
            console.error(e);
            document.getElementById('statusBadge').innerText = '❌ โหลดเสียง Google ไม่สำเร็จ (เช็ค Backend URL / API Key)';
        }
    }

    function populateGoogleVoiceSelect() {
        const select = document.getElementById('voiceSelect');
        if (!select) return;
        select.innerHTML = '';
        googleVoices.forEach((v, i) => {
            const opt = document.createElement('option');
            opt.value = String(i);
            opt.textContent = `${v.name} (${v.language || ''})`;
            select.appendChild(opt);
        });
        if (googleVoices.length > 0) {
            select.value = '0';
            selectedGoogleVoice = googleVoices[0].name;
        }
    }

    function stopCurrentAudio() {
        if (currentAudio) {
            try { currentAudio.pause(); } catch (e) {}
            currentAudio = null;
        }
    }

    function playGoogleAudio(text, voiceName, speed) {
        return new Promise((resolve) => {
            const base = ttsBackend().replace(/\/$/, '');
            fetch(base, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, voice: voiceName, speed: parseFloat(speed) })
            })
            .then(r => { if (!r.ok) throw new Error('tts error ' + r.status); return r.arrayBuffer(); })
            .then(buf => {
                const blob = new Blob([buf], { type: 'audio/mpeg' });
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                currentAudio = audio;
                const cleanup = () => { try { URL.revokeObjectURL(url); } catch(e){} currentAudio = null; };
                audio.onended = () => { cleanup(); resolve(); };
                audio.onerror = () => { cleanup(); resolve(); };
                audio.play().catch(() => { cleanup(); resolve(); });
            })
            .catch(err => { console.error(err); resolve(); });
        });
    }

    if (speechSupported) {
        speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();
        // บางเบราว์เซอร์โหลดเสียงช้า ให้ลองเรียกอีกครั้งหลังดีเลย์
        setTimeout(loadVoices, 500);
    }

    function updateSpeedLabel(val) {
        document.getElementById('speedVal').innerText = val + 'x';
    }

    function speakAsync(text, speed) {
        return new Promise((resolve) => {
            if (!isPlaying || !speechSupported) {
                return resolve();
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = parseFloat(speed);
            utterance.pitch = 1.5;

            const voice = selectedVoice || usFemaleVoice;
            if (voice) {
                utterance.voice = voice;
                utterance.lang = voice.lang;
            } else {
                utterance.lang = 'en-US';
            }

            utterance.onend = () => resolve();
            utterance.onerror = () => resolve();

            window.speechSynthesis.speak(utterance);
        });
    }

    // พูดแบบทับซ้อน: ตัดเสียงตัวก่อนหน้าแล้วพูดตัวใหม่ทันที (ไม่รอให้พูดจบ)
    function speakOverlap(text, speed) {
        if (!isPlaying || !speechSupported) return;

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = parseFloat(speed);
        utterance.pitch = 1.5;

        const voice = selectedVoice || usFemaleVoice;
        if (voice) {
            utterance.voice = voice;
            utterance.lang = voice.lang;
        } else {
            utterance.lang = 'en-US';
        }

        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
    }

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function renderWordTiles(word) {
    const container = document.getElementById('lettersContainer');
    const fullText = document.getElementById('fullWordText');
    container.innerHTML = '';
    fullText.innerText = word;
    fullText.classList.remove('active-full');
    document.querySelectorAll('.letter-tile').forEach(tile => tile.classList.remove('active'));

    word.split('').forEach((char, index) => {
        const tile = document.createElement('div');
        tile.className = 'letter-tile';
        tile.id = `tile-${index}`;
        tile.innerText = char;
        container.appendChild(tile);
    });
}

function renderWordList() {
    const list = document.getElementById('wordList');
    list.innerHTML = '';
    currentWords.forEach((w, i) => {
        const item = document.createElement('div');
        item.className = 'word-list-item';
        item.id = `wordListItem-${i}`;
        item.innerText = (i + 1) + '. ' + (currentWordDisplay[i] || w);
        item.onclick = () => startSpellingFrom(i);
        list.appendChild(item);
    });
    setActiveWordListItem(currentWordIndex);
}

function startSpellingFrom(startIdx) {
    if (currentWords.length === 0) return;
    stopSpelling();
    currentWordIndex = startIdx;
    startSpellingProcess(startIdx);
}

function setActiveWordListItem(index) {
    currentWordIndex = index;
    document.querySelectorAll('.word-list-item').forEach(el => el.classList.remove('active'));
    const el = document.getElementById(`wordListItem-${index}`);
    if (el) el.classList.add('active');
}

function isValidImageFile(file) {
    if (!file || !file.type || !file.type.startsWith('image/')) return false;
    const maxSize = 10 * 1024 * 1024;
    return file.size <= maxSize;
}

// ระบบสแกนรูปภาพจริงด้วย Tesseract.js (OCR)
async function handleImageUpload(event) {
    const file = event.target.files && event.target.files[0];
    const statusBadge = document.getElementById('statusBadge');

    if (!file) return;

    if (!isValidImageFile(file)) {
        statusBadge.innerText = '❌ กรุณาเลือกไฟล์รูปภาพที่ใช้งานได้ และมีขนาดไม่เกิน 10 MB';
        event.target.value = '';
        return;
    }

    stopSpelling();
    statusBadge.innerText = '⏳ กำลังสแกนตัวอักษรจากรูปภาพ...';

    try {
        const result = await Tesseract.recognize(file, 'eng', {
            logger: m => {
                if (m.status === 'recognizing text') {
                    const progress = Math.round(m.progress * 100);
                    statusBadge.innerText = `⏳ กำลังประมวลผลรูปภาพ... ${progress}%`;
                }
            }
        });

        // ดึงเฉพาะ Words (Part of Speech) เช่น "empty (adj.)" "peanut butter (n.)"
        const rawText = result.data.text;
        const posPattern = /([A-Za-z][A-Za-z\s]*?)\s*\((n\.|v\.|adj\.|adv\.|prep\.|conj\.|pron\.|vt\.|vi\.)\)/gi;
        const matches = [...rawText.matchAll(posPattern)];
        const extractedWords = matches.map(m => m[1].trim().toUpperCase()).filter(w => w.length > 0);
        const extractedDisplay = matches.map(m => m[0].trim());

        if (extractedWords.length > 0) {
            currentWords = extractedWords;
            currentWordDisplay = extractedDisplay;
            currentWordIndex = 0;
            statusBadge.innerText = `🎉 สแกนสำเร็จ! พบคำศัพท์ ${currentWords.length} คำ`;
            renderWordTiles(currentWords[0]);
            renderWordList();
        } else {
            statusBadge.innerText = '❌ ไม่พบคำศัพท์ (Words/Part of Speech) ในรูปภาพ กรุณาใช้รูปตารางคำศัพท์';
        }
    } catch (error) {
        console.error(error);
        statusBadge.innerText = '❌ เกิดข้อผิดพลาดในการอ่านรูปภาพ';
    }
}

async function startSpellingProcess(startIdx = 0) {
    if (isPlaying) return;
    useGoogleTTS = document.getElementById('useGoogleTTS').checked;
    if (!speechSupported && !useGoogleTTS) {
        document.getElementById('statusBadge').innerText = '⚠️ เบราว์เซอร์นี้ไม่รองรับเสียงอ่าน กรุณาใช้ Chrome หรือ Edge เพื่อใช้งานฟีเจอร์นี้';
        return;
    }
    if (useGoogleTTS && !selectedGoogleVoice) {
        document.getElementById('statusBadge').innerText = '⚠️ ยังไม่ได้เลือกเสียง Google โปรดรอโหลดรายชื่อเสียง หรือเช็ค Backend URL';
        return;
    }

isPlaying = true;

const playbackToken = ++currentPlaybackToken;
const speed = document.getElementById('speedSlider').value;
const letterDelay = parseInt(document.getElementById('letterDelaySlider').value);
const wordDelay = parseFloat(document.getElementById('wordDelaySlider').value) * 1000;

try {
    for (let wIdx = startIdx; wIdx < currentWords.length; wIdx++) {
        if (!isPlaying || playbackToken !== currentPlaybackToken) break;

        const word = currentWords[wIdx].toUpperCase().trim();
        renderWordTiles(word);
        setActiveWordListItem(wIdx);

        document.getElementById('statusBadge').innerText = `กำลังสะกดคำที่ ${wIdx + 1}/${currentWords.length}: ${word}`;

        // 1. สะกดทีละตัวอักษร
        for (let i = 0; i < word.length; i++) {
            if (!isPlaying || playbackToken !== currentPlaybackToken) break;

            const tile = document.getElementById(`tile-${i}`);
            if (tile) tile.classList.add('active');

            if (letterDelay < 0) {
                // โหมดเร็ว: พูดทับตัวก่อนหน้า ไม่รอให้พูดจบ
                // ค่าติดลบยิ่งมาก = ตัดเร็วขึ้น (แต่ละตัวถูกตัดหลังจากผ่านไป 2000+letterDelay ms)
                const cutWindow = Math.max(0, 2000 + letterDelay);
                if (useGoogleTTS) {
                    stopCurrentAudio();
                    playGoogleAudio(word[i], selectedGoogleVoice, speed);
                    await sleep(cutWindow);
                } else {
                    speakOverlap(word[i], speed);
                    await sleep(cutWindow);
                }
            } else {
                if (useGoogleTTS) {
                    await playGoogleAudio(word[i], selectedGoogleVoice, speed);
                } else {
                    await speakAsync(word[i], speed);
                }
                await sleep(letterDelay);
            }

            if (playbackToken !== currentPlaybackToken || !isPlaying) break;
            if (tile) tile.classList.remove('active');
        }

        if (!isPlaying || playbackToken !== currentPlaybackToken) break;
        await sleep(300);

        // 2. อ่านรวมคำ
        const fullText = document.getElementById('fullWordText');
        fullText.classList.add('active-full');
        stopCurrentAudio();
        if (useGoogleTTS) {
            await playGoogleAudio(word, selectedGoogleVoice, speed);
        } else {
            await speakAsync(word, speed);
        }
        await sleep(500);
        fullText.classList.remove('active-full');

        // 3. เว้นระยะห่างก่อนไปคำถัดไป
        if (wIdx < currentWords.length - 1) {
            document.getElementById('statusBadge').innerText = `รอคำถัดไป... (${wordDelay / 1000} วินาที)`;
            if (!isPlaying || playbackToken !== currentPlaybackToken) break;
            await sleep(wordDelay);
        }
    }

    if (playbackToken === currentPlaybackToken && isPlaying) {
        document.getElementById('statusBadge').innerText = '🎉 อ่านครบทุกคำแล้ว! เก่งมากครับ!';
    }
} finally {
    if (playbackToken === currentPlaybackToken) {
        isPlaying = false;
    }
}
}

function stopSpelling() {
    currentPlaybackToken += 1;
    isPlaying = false;

    if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
    }
    stopCurrentAudio();

    document.getElementById('statusBadge').innerText = 'หยุดการเล่นแล้ว';
    document.querySelectorAll('.letter-tile').forEach(t => t.classList.remove('active'));
    document.getElementById('fullWordText').classList.remove('active-full');
}

renderWordTiles(currentWords[0]);
renderWordList();
</script>
